name: Renovar token de Instagram
on:
  schedule:
    - cron: '0 13 1 * *'        # día 1 de cada mes (el token dura 60 días)
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Renovar y guardar el secreto
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          node scripts/refresh-token.mjs /tmp/new_token.txt
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/new_token.txt
